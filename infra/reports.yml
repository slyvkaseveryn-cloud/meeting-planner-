AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The weekly meetings report, built by events. EventBridge Scheduler (every
  Monday 07:00 Kyiv) and `make report-now` put a message on an SQS queue; the
  report-builder Lambda (backend image, in the VPC) reads Aurora and writes
  reports/<week>.csv to S3 through a gateway endpoint; the ObjectCreated event
  starts the report-mailer Lambda (outside the VPC), which emails the CSV
  through SES.

Parameters:
  ProjectName:
    Type: String
    Description: Prefix for resource names, and the PROJECT_NAME tag.

  ImageUri:
    Type: String
    Description: >-
      Backend image with app/reports in it, pinned by digest
      (<account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...).

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The API function's subnets; the builder runs in the same ones.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The API function's security group, which the database already admits.

  RouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables of those subnets, for the S3 gateway endpoint.

  CreateS3Endpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" when the VPC already has an S3 gateway endpoint on these route
      tables (a second one is refused).

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: The API function's DATABASE_URL.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  ScheduleExpression:
    Type: String
    Default: "cron(0 7 ? * MON *)"
    Description: >-
      When the weekly report is requested. Set rate(5 minutes) for one test
      run, then set it back.

  SenderEmail:
    Type: String
    Description: The From address. Must be a verified SES identity (this stack verifies it).

  RecipientEmails:
    Type: String
    Description: >-
      Comma-separated recipients. In the SES sandbox each must be verified;
      when it is the sender's address, no second identity is needed.

  SenderDomain:
    Type: String
    Default: ""
    Description: >-
      Optional domain to verify with DKIM (its three CNAMEs are outputs).
      Empty verifies only SenderEmail, by a link SES emails to it.

  VerifyRecipient:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: '"true" also creates an SES identity for RecipientEmails (a single address).'

  FailWeek:
    Type: String
    Default: ""
    Description: A week (e.g. 2026-W30) the builder fails on, to watch the DLQ. Empty in normal use.

Conditions:
  HasS3Endpoint: !Equals [!Ref CreateS3Endpoint, "true"]
  HasDomain: !Not [!Equals [!Ref SenderDomain, ""]]
  HasRecipientIdentity: !Equals [!Ref VerifyRecipient, "true"]

Resources:
  # --- storage --------------------------------------------------------------

  # Named explicitly: the mailer's invoke permission needs the bucket's ARN,
  # and the bucket's notification needs that permission to exist first. With
  # !GetAtt Bucket.Arn that is a circular dependency; a constructed name is not.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: MailerInvokePermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # The builder has no NAT; without this its PutObject hangs until the timeout.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: HasS3Endpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: !Ref RouteTableIds

  # --- queue ----------------------------------------------------------------

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days, the most SQS keeps
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  RequestQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      # 6 x the builder's 60 s timeout: a message must not reappear while the
      # first attempt is still running, or a second builder starts on it.
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- builder (in the VPC) ---------------------------------------------------

  BuilderRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: write-reports
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Builds reports/<week>.csv from Aurora (backend image, other handler)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures:
        - !Ref Architecture
      Role: !GetAtt BuilderRole.Arn
      MemorySize: 512
      # Aurora may need ~15 s to resume from a pause.
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: !Ref AppTimezone
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          REPORT_FAIL_WEEK: !Ref FailWeek
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Lambda polls the queue for the function, so a VPC without NAT is fine.
  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EventSourceArn: !GetAtt RequestQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1

  # --- schedule ---------------------------------------------------------------

  SchedulerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-report-request
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RequestQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      Description: Request last week's report every Monday morning
      ScheduleExpression: !Ref ScheduleExpression
      # Without it the cron runs in UTC and the report drifts with DST.
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt RequestQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # --- mailer (outside the VPC) ----------------------------------------------

  MailerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-and-send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read only: a mailer that could write to reports/ would trigger itself.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action: [ses:SendRawEmail, ses:SendEmail]
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Emails a new reports/*.csv through SES
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerRole.Arn
      MemorySize: 256
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          SENDER: !Ref SenderEmail
          RECIPIENTS: !Ref RecipientEmails
      Code:
        ZipFile: |
          """report-mailer: reacts to ObjectCreated on reports/*.csv and emails the file."""
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger("report-mailer")
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def handler(event, context):
              record = event["Records"][0]
              bucket = record["s3"]["bucket"]["name"]
              key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
              # The line submitted for the lab: which event started the function.
              log.info("report-mailer triggered trigger=s3 event=%s key=%s",
                       record.get("eventName"), key)

              body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              week = key.rsplit("/", 1)[-1].removesuffix(".csv")
              recipients = [r.strip() for r in os.environ["RECIPIENTS"].split(",") if r.strip()]

              msg = EmailMessage()
              msg["Subject"] = f"Weekly meetings report {week}"
              msg["From"] = os.environ["SENDER"]
              msg["To"] = ", ".join(recipients)
              msg.set_content(f"The meetings report for {week} is attached.\n")
              msg.add_attachment(body, maintype="text", subtype="csv",
                                 filename=f"meetings-{week}.csv")

              sent = ses.send_email(
                  FromEmailAddress=os.environ["SENDER"],
                  Destination={"ToAddresses": recipients},
                  Content={"Raw": {"Data": msg.as_bytes()}},
              )
              log.info("report sent key=%s to=%s message_id=%s",
                       key, recipients, sent["MessageId"])
              return {"key": key, "message_id": sent["MessageId"]}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Lets S3 (only from this bucket, in this account) invoke the mailer.
  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !GetAtt MailerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref AWS::AccountId

  # --- SES ---------------------------------------------------------------------

  # SES mails a verification link to this address; click it once.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref SenderEmail

  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: HasRecipientIdentity
    Properties:
      EmailIdentity: !Ref RecipientEmails

  DomainIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: HasDomain
    Properties:
      EmailIdentity: !Ref SenderDomain

Outputs:
  ReportsBucket:
    Value: !Ref ReportsBucket
  QueueUrl:
    Value: !Ref RequestQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  BuilderFunction:
    Value: !Ref BuilderFunction
  MailerFunction:
    Value: !Ref MailerFunction
  DkimRecords:
    Condition: HasDomain
    Description: Add these three as CNAME records at your DNS provider
    Value: !Join
      - " | "
      - - !Sub "${DomainIdentity.DkimDNSTokenName1} CNAME ${DomainIdentity.DkimDNSTokenValue1}"
        - !Sub "${DomainIdentity.DkimDNSTokenName2} CNAME ${DomainIdentity.DkimDNSTokenValue2}"
        - !Sub "${DomainIdentity.DkimDNSTokenName3} CNAME ${DomainIdentity.DkimDNSTokenValue3}"
